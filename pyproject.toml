[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "devbeats"
version = "0.1.0"
description = "Music-as-code CLI for creating gentle MIDI lullabies and LMMS projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
devbeats = "devbeats.main:app"

[tool.hatch.build.targets.wheel]
packages = ["devbeats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

